<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Wasserstand Aare</title>
</head>
 
<header class="header">
    <!--Kalender-->
    <input type="datetime-local" id="dateTime" step="3600">
    
<!-- Radiobutton-Menü -->
<nav>
  <form id="hauptmenue">
    <label><input type="radio" name="ort" value="brienz" checked>Brienz</label><br>
    <label><input type="radio" name="ort" value="interlaken">Interlaken</label><br>
    <label><input type="radio" name="ort" value="thun">Thun</label><br>
    <label><input type="radio" name="ort" value="bern">Bern</label><br>
    <label><input type="radio" name="ort" value="hagneck">Hagneck</label><br>
    <label><input type="radio" name="ort" value="biel">Biel</label><br>
    <label><input type="radio" name="ort" value="olten">Olten</label><br>
    <label><input type="radio" name="ort" value="brugg">Brugg</label>
  </form>
</nav>
</header>

<body>

   <video autoplay muted loop playsinline id="background-video">
    <source src="assets/video/animation_final.mp4" type="video/mp4" />
    </video>

    <h1 class="title" id="title">Wie viel Wasser fliesst in der Aare?</h1>
        <main>
            <div class="Wassertemperatur">
              <p class="Zahl-Temp">25&deg;C</p>
              <p class="Text-Temp">Wassertemperatur</p>
            </div>
            
           <div class="Flow">
              <div class="Flow-Value">
               <p class="Zahl-Flow">25</p>
               <p class="Einheit-Flow">m³/s</p>
              </div>
               <p class="Text-Flow">fliessen in der Aare</p>
              </div>
                <input type="datetime-local" id="datePicker">
        </main>

    <script src="js/script.js" type="module"></script>
</body>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Wasserstand Aare</title>
</head>
 
<header class="header">
    <!--Kalender-->
    <input type="datetime-local" id="dateTime" step="3600">
    
<!-- Radiobutton-Menü -->
<nav class="dropdown">
  <button type="button" class="dropdown-toggle" id="selected-location">
    Bern
    <span class="arrow">&#9660;</span>
  </button>

  <form id="hauptmenue" class="dropdown-menu">
    <label><input type="radio" name="city" value="brienz"> Brienz</label>
    <label><input type="radio" name="city" value="interlaken"> Interlaken</label>
    <label><input type="radio" name="city" value="thun"> Thun</label>
    <label><input type="radio" name="city" value="bern" checked> Bern</label>
    <label><input type="radio" name="city" value="hagneck"> Hagneck</label>
    <label><input type="radio" name="city" value="biel"> Biel</label>
    <label><input type="radio" name="city" value="olten"> Olten</label>
    <label><input type="radio" name="city" value="brugg"> Brugg</label>
  </form>
</nav>

</header>

<body>

   <video autoplay muted loop playsinline id="background-video">
    <source src="assets/video/animation_final.mp4" type="video/mp4" />
    </video>

    <h1 class="title" id="title">Wie viel Wasser fliesst in der Aare?</h1>
        <main>
            <div class="Wassertemperatur">
              <p class="Zahl-Temp" id="cityTemp">25&deg;C</p>
              <p class="Text-Temp">Wassertemperatur</p>
            </div>
            
           <div class="Flow">
              <div class="Flow-Value">
               <p class="Zahl-Flow" id="cityFlow">25</p>
               <p class="Einheit-Flow">m³/s</p>
              </div>
               <p class="Text-Flow">fliessen in der Aare</p>
              </div>
                <input type="datetime-local" id="datePicker">
              
        </main>

    <script src="js/script.js" type="module"></script>
</body>
